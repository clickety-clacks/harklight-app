name: Harklight
options:
  bundleIdPrefix: com.example.attentionclient
  deploymentTarget:
    iOS: "27.0"
packages:
  AttentionDomain:
    path: AttentionDomain
  HarklightNativeRelay:
    path: NativeRelay
targets:
  Harklight:
    type: application
    platform: iOS
    dependencies:
      - package: AttentionDomain
        product: AttentionDomain
      - package: HarklightNativeRelay
        product: HarklightNativeRelay
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.clicketyclacks.Harklight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: Z7R59J7QV8
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Signing/ReceiverDevelopment.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Harklight
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Configuration/HarklightInfo.plist
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: YES
  HarklightConversationUITestHost:
    type: application
    platform: iOS
    dependencies:
      - package: AttentionDomain
        product: AttentionDomain
      - package: HarklightNativeRelay
        product: HarklightNativeRelay
    sources:
      - path: Sources
        excludes:
          - HarklightApp.swift
      - path: UITestHost
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.attentionclient.duo-prototype.uitesthost
        INFOPLIST_KEY_CFBundleDisplayName: Harklight Conversation UI Tests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Configuration/HarklightInfo.plist
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
  HarklightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: AttentionDomain
        product: AttentionDomain
      - package: HarklightNativeRelay
        product: HarklightNativeRelay
      - target: Harklight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.attentionclient.duo-prototype.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
  HarklightUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - ConversationSampleUITests.swift
    dependencies:
      - target: Harklight
      - package: AttentionDomain
        product: AttentionDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.attentionclient.duo-prototype.uitests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: Harklight
  HarklightConversationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/ConversationSampleUITests.swift
    dependencies:
      - target: HarklightConversationUITestHost
      - package: AttentionDomain
        product: AttentionDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.attentionclient.duo-prototype.conversation.uitests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: HarklightConversationUITestHost
schemes:
  Harklight:
    build:
      targets:
        Harklight: all
    test:
      config: Debug
      targets:
        - HarklightTests
        - HarklightUITests
        - HarklightConversationUITests
