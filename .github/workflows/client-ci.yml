name: Client CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_ui:
        description: Also run the iPhone UI suites and the iPad layout tests
        type: boolean
        default: false

# Manual runs share one group of their own, so a push to main and a manual run
# on main neither cancel nor block each other; a newer manual run replaces an
# older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-notes:
    name: In-app What's New
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check in-app release notes
        if: github.event_name != 'workflow_dispatch'
        run: python3 ci_scripts/check_release_notes_archive.py --repo . --commit "$GITHUB_SHA"

  # Runner budget: pull requests run only the two short jobs below. The long
  # simulator jobs run at most one at a time each, and never per pull request,
  # so this repository cannot occupy every hosted macOS runner.
  ios-unit-tests:
    name: iOS unit tests
    runs-on: xcode-27
    # Measured 8 to 14 minutes; the limit only stops a stuck runner.
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and test iOS unit suites
        env:
          HARKLIGHT_ONLY_TESTING: >-
            HarklightTests
            HarklightNativeRelayTests
        run: Scripts/verify.sh test

  # The two UI suites run one after the other in one concurrency group, so with
  # the iPad layout group this repository runs at most two long simulator jobs
  # at once. Each suite finishes well inside its limit on its own; together in
  # one job they took about 112 minutes and hit the limit without a result.
  ios-ui-tests:
    name: iOS UI tests
    # Run only when asked for until a full run on main shows these suites pass.
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui
    concurrency:
      group: harklight-heavy-ios-ui
      cancel-in-progress: false
    runs-on: xcode-27
    # Measured 109 minutes on a slow runner (run 44294069733). The limit only
    # stops a stuck runner; the per-test allowance catches a hung test.
    timeout-minutes: 160
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and test iOS UI suite
        env:
          HARKLIGHT_ONLY_TESTING: HarklightUITests
          # Slowest passing UI test measured 509 s on a slow runner (run
          # 44294069733); this is about twice that. A test that runs past this
          # many seconds fails by itself instead of holding the job.
          HARKLIGHT_TEST_TIME_ALLOWANCE: "1020"
          HARKLIGHT_BOOT_SIMULATOR_FIRST: "1"
        run: Scripts/verify.sh test

  ios-conversation-ui-tests:
    name: iOS conversation UI tests
    # Starts after iOS UI tests ends, whatever its result, in the same group.
    needs: ios-ui-tests
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.run_ui }}
    concurrency:
      group: harklight-heavy-ios-ui
      cancel-in-progress: false
    runs-on: xcode-27
    # Measured 58 minutes on a slow runner (run 44294069733).
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and test iOS conversation UI suite
        env:
          HARKLIGHT_ONLY_TESTING: HarklightConversationUITests
          HARKLIGHT_TEST_TIME_ALLOWANCE: "1020"
          HARKLIGHT_BOOT_SIMULATOR_FIRST: "1"
        run: Scripts/verify.sh test

  ios-ipad-layout-tests:
    name: iOS iPad layout tests
    # Measured about 21 minutes. Runs for main and on request, one at a time.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_ui)
    concurrency:
      group: harklight-heavy-ipad-layout
      cancel-in-progress: false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select an available iPad simulator
        run: |
          xcrun simctl list devices available --json | python3 -c '
          import json, os, re, sys

          devices = []
          for runtime, entries in json.load(sys.stdin)["devices"].items():
              version = re.search(r"iOS-(\d+)(?:-(\d+))?", runtime)
              if not version or int(version.group(1)) < 27:
                  continue
              runtime_version = (int(version.group(1)), int(version.group(2) or 0))
              for device in entries:
                  name = device.get("name", "")
                  if device.get("isAvailable") and name.startswith("iPad"):
                      devices.append((runtime_version, name, device.get("udid")))

          devices.sort(key=lambda item: (item[0], "iPad Pro" in item[1], item[1]), reverse=True)
          if not devices or not devices[0][2]:
              sys.exit("No available iPad simulator on iOS 27 or newer.")

          runtime, name, device_id = devices[0]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"HARKLIGHT_SIMULATOR_ID={device_id}\n")
          print(f"Selected {name} on iOS {runtime[0]}.{runtime[1]} for regular-width UI tests.")
          '

      - name: Test layout selectors on regular-width iPad
        env:
          HARKLIGHT_ONLY_TESTING: >-
            HarklightUITests/AdaptiveDuoNavigationUITests/testLandscapeSelectionKeepsListAndDetailVisibleAcrossMessages
            HarklightUITests/AdaptiveDuoNavigationUITests/testSelectingAnotherMessageFromPortraitOverlayUpdatesDetailAndDismissesIt
            HarklightConversationUITests/ConversationSampleUITests/testPriorityRowsAndNewMessageAreaRenderIn250PointListColumn
          HARKLIGHT_BOOT_SIMULATOR_FIRST: "1"
        run: Scripts/verify.sh test

  native-host-tests:
    name: NativeHost tests
    runs-on: xcode-27
    # Measured under 2 minutes.
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test NativeHost
        run: Scripts/verify.sh native-host-test
