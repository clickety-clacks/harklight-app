name: Client CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ios-unit-tests:
    name: iOS unit tests
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and test iOS unit suites
        env:
          HARKLIGHT_ONLY_TESTING: >-
            HarklightTests
            HarklightNativeRelayTests
        run: Scripts/verify.sh test

  ios-ui-tests:
    name: iOS UI tests
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and test iOS UI suites
        env:
          HARKLIGHT_ONLY_TESTING: >-
            HarklightUITests
            HarklightConversationUITests
        run: Scripts/verify.sh test

  native-host-tests:
    name: NativeHost tests
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test NativeHost
        run: Scripts/verify.sh native-host-test
