<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harklight palette</title>
<style>
  :root { --page: #f3f3f5; --ink: #111; --ink2: #666; --card: #fff; --line: #ddd; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0d0d0f; --ink: #eee; --ink2: #999; --card: #18181b; --line: #2c2c30; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  header.page { position: sticky; top: 0; z-index: 10; background: var(--page); padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header.page h1 { font-size: 17px; margin: 0 12px 0 0; }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--ink); font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .seg button.on { background: var(--ink); color: var(--page); }
  main { padding: 16px; max-width: 1600px; margin: 0 auto; }
  .blurb { color: var(--ink2); margin: 0 0 16px; max-width: 70ch; }
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px; }
  .mode h2 { font-size: 15px; margin: 0 0 10px; color: var(--ink2); font-weight: 600; }
  .phones { display: flex; flex-wrap: wrap; gap: 16px; }

  /* phone */
  .phone { width: 340px; max-width: 100%; height: 780px; border-radius: 44px; border: 8px solid #2a2a2e; background: var(--bg); color: var(--text); position: relative; overflow: hidden; font-size: 15px; }
  .status { height: 44px; padding: 14px 28px 0; font-weight: 600; font-size: 15px; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 10px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 28px; letter-spacing: -0.5px; }
  .glass { background: var(--glass); backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6); border: 1px solid var(--glassEdge); box-shadow: 0 4px 16px rgba(0,0,0,.12); }
  .circle { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
  .row { padding: 13px 16px; border-bottom: 0.5px solid var(--separator); }
  .row.toptier { background: var(--rowTop); padding: 18px 16px; }
  .row.sel { background: var(--rowSelected); }
  .meta { display: flex; justify-content: space-between; color: var(--text2); font-size: 13px; margin-bottom: 3px; }
  .t-top { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.2; }
  .t-mid { font-size: 17px; font-weight: 600; }
  .t-low { font-size: 15px; font-weight: 600; }
  .t-err { color: var(--errorTitle); }
  .t-warn { color: var(--warningTitle); }
  .resolved, .resolved .meta { color: var(--text2); }
  .body { color: var(--text2); margin-top: 3px; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
  .row.toptier .body { color: var(--text); }
  .l2 { -webkit-line-clamp: 2; } .l4 { -webkit-line-clamp: 4; } .l8 { -webkit-line-clamp: 8; }
  .bottom { position: absolute; left: 16px; right: 16px; bottom: 22px; display: flex; justify-content: space-between; align-items: center; }
  .tabs { display: flex; gap: 4px; border-radius: 999px; padding: 4px; }
  .tab { width: 64px; height: 44px; border-radius: 999px; display: grid; place-items: center; color: var(--text2); }
  .tab.on { background: var(--tabOn); color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; margin-left: 6px; vertical-align: middle; }

  /* detail */
  .dtop { display: flex; justify-content: space-between; align-items: center; padding: 4px 16px 10px; }
  .pill { border-radius: 999px; padding: 10px 16px; font-size: 15px; }
  .accentbtn { background: var(--accent); color: var(--onAccent); }
  .dbody { padding: 6px 18px; }
  .sender { display: flex; align-items: center; gap: 10px; color: var(--text2); font-size: 14px; }
  .ini { width: 30px; height: 30px; border-radius: 50%; background: var(--rowTop); color: var(--text); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .dtitle { font-size: 24px; font-weight: 700; line-height: 1.2; margin: 12px 0 8px; letter-spacing: -0.3px; }
  .dtext { margin: 0 0 14px; }
  .choice { border-radius: 16px; padding: 13px 14px; margin-bottom: 8px; border: 1px solid var(--separator); display: flex; gap: 10px; align-items: center; }
  .choice.on { border-color: var(--accent); background: var(--rowSelected); display: block; }
  .choice .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--text2); flex: none; }
  .choice.on .radio { border: 6px solid var(--accent); }
  .reply { margin-top: 10px; background: var(--replySurface); border-radius: 12px; padding: 10px 12px; color: var(--text); min-height: 60px; font-size: 14px; }
  .send { margin-top: 8px; text-align: right; }
  .send span { display: inline-block; border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; }
  .fab { position: absolute; right: 18px; bottom: 26px; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); }

  .phone.detail { --bg: var(--detailBg); --text: var(--detailText); --text2: var(--detailText2); --accent: var(--detailText); --onAccent: var(--detailBg);
    --separator: color-mix(in srgb, var(--detailText) 30%, transparent); --rowSelected: var(--detailSelected); --replySurface: var(--detailField);
    --rowTop: color-mix(in srgb, var(--detailText) 18%, transparent); --glass: color-mix(in srgb, var(--detailText) 16%, transparent); --glassEdge: color-mix(in srgb, var(--detailText) 25%, transparent); }
  .modes.stacked { grid-template-columns: 1fr; }
  .row.typed { position: relative; background: var(--bg); }
  .row.typed.back::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 6px; background: var(--backbar); border-radius: 6px 0 0 6px; }
  .wide { display: flex; width: 760px; max-width: 100%; height: 640px; border: 8px solid #2a2a2e; border-radius: 28px; overflow: hidden; margin-top: 16px; }
  .wide .phone { border: 0; border-radius: 0; height: 100%; flex: none; }
  .wide .phone:first-child { width: 320px; }
  .wide .phone.detail { flex: 1; width: auto; }
  .wide .row.typed.back::after { width: 10px; border-radius: 8px 0 0 8px; }
  .phone.tall { height: auto; padding-bottom: 96px; }
  .wide .phone .status { visibility: hidden; height: 20px; }
  .tsender { display: inline-flex; gap: 6px; align-items: center; }
  .typelabel { display: inline-flex; gap: 6px; align-items: center; margin-top: 14px; font-size: 13px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; color: var(--text2); }
  .typelabel + .dtitle { margin-top: 4px; }
  .seenbtn { display: inline-flex; gap: 8px; align-items: center; border-radius: 999px; padding: 10px 18px; font-weight: 600; }
  .detail .sender { margin-bottom: 10px; }
  .tright { display: inline-flex; gap: 6px; align-items: center; }
  .chatflag { display: inline-flex; color: var(--text2); }
  .chatflag.new { color: var(--accent); }
  .ctext { min-width: 0; }
  .committed { margin-top: 6px; color: var(--text); font-size: 14px; opacity: .92; border-top: 1px solid var(--separator); padding-top: 6px; }
  .choice.on { display: flex; align-items: flex-start; }
  .choice.on .radio { margin-top: 1px; }
  .fabnew { background: var(--detailText); color: var(--detailBg); box-shadow: 0 4px 16px rgba(0,0,0,.2); }
  .fabnew i { position: absolute; top: 6px; right: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--seen); border: 2px solid var(--detailText); }
  .kbwrap { position: absolute; left: 0; right: 0; bottom: 0; }
  .replybar { display: flex; gap: 8px; align-items: flex-end; padding: 8px 10px; }
  .replyfield { flex: 1; max-height: 30vh; overflow: auto; background: var(--kbField); color: var(--kbText); border-radius: 20px; padding: 9px 14px; font-size: 15px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .sendup { width: 36px; height: 36px; border-radius: 50%; background: var(--detailText); color: var(--detailBg); display: grid; place-items: center; flex: none; margin-bottom: 2px; }
  .kb { background: var(--kbBg); padding: 8px 3px 26px; }
  .kbrow { display: flex; justify-content: center; gap: 5px; margin: 0 0 9px; }
  .kbrow span { flex: 0 0 26px; height: 38px; border-radius: 6px; background: var(--kbKey); color: var(--kbText); display: grid; place-items: center; font-size: 17px; box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .kbrow span.wide { flex: 0 0 64px; font-size: 14px; background: var(--kbKey2); }
  .kbrow span.space { flex: 1 1 auto; max-width: 160px; font-size: 14px; }
  [data-mode="light"] { --kbBg: #D2D4DA; --kbKey: #FFFFFF; --kbKey2: #ABB0BA; --kbText: #000; --kbField: #FFFFFF; }
  [data-mode="dark"] { --kbBg: #2B2B2E; --kbKey: #6B6B6E; --kbKey2: #464649; --kbText: #fff; --kbField: #3A3A3D; }
  .notices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; width: 340px; max-width: 100%; padding: 12px; border-radius: 20px; background: var(--bg); }
  .notice { border-radius: 14px; padding: 10px 12px; font-size: 13px; }
  .notice b { display: block; font-size: 14px; margin-bottom: 2px; }
  .n-info { background: var(--infoBody); color: var(--infoText); }
  .n-err { background: var(--errorBody); color: var(--errorText); }
  .n-warn { background: var(--warningBody); color: var(--warningText); }
  .n-done { background: var(--doneBody); color: var(--doneText); }
  .seen { display: inline-flex; gap: 6px; align-items: center; margin-top: 6px; padding: 5px 10px; border-radius: 999px; background: rgba(127,127,127,.12); color: var(--seen); font-weight: 600; }

  /* swatches */
  .swatches { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .sw { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 12px; cursor: pointer; }
  .sw .chip { height: 44px; border-bottom: 1px solid var(--line); }
  .sw .lab { padding: 6px 8px; }
  .sw .lab b { display: block; font-size: 12px; }
  .sw .lab code { color: var(--ink2); font-size: 11px; }
  .sw .warnflag { color: #c62; font-size: 11px; }

  /* comments */
  .targetable { cursor: pointer; }
  .picked { outline: 3px solid #ff3b8d !important; outline-offset: 2px; }
  #cbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: flex-end; }
  #cbar .tgt { font-size: 12px; color: var(--ink2); margin-bottom: 4px; }
  #cbar textarea { width: 100%; min-height: 40px; max-height: 140px; resize: vertical; font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--page); color: var(--ink); }
  #cbar button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 16px; background: #0a84ff; color: #fff; cursor: pointer; }
  #cbar .grow { flex: 1; min-width: 0; }
  #log { margin: 24px 0 140px; }
  #log h2 { font-size: 15px; }
  #log li { margin-bottom: 6px; }
  #log .when { color: var(--ink2); font-size: 12px; }
</style>
</head>
<body>
<header class="page">
  <h1>Harklight palette</h1>
  <div class="seg" id="palPick"></div>
</header>
<main>
  <p class="blurb" id="palNote"></p>
  <div class="modes" id="modes"></div>
</main>
<script src="palettes.js"></script>
<script>
const ROLES = [
  ["bg", "Background"], ["rowTop", "Top-tier row"], ["rowSelected", "Last-viewed row"],
  ["text", "Primary text"], ["text2", "Secondary text"], ["accent", "Accent"], ["onAccent", "On accent"],
  ["separator", "Separator"], ["glass", "Glass fill"],
  ["errorTitle", "Error title"], ["warningTitle", "Warning title"],
  ["infoBody", "Info body"], ["infoText", "Info text"],
  ["errorBody", "Error body"], ["errorText", "Error text"],
  ["warningBody", "Warning body"], ["warningText", "Warning text"],
  ["doneBody", "Completed body"], ["doneText", "Completed text"],
  ["replySurface", "Reply editor"], ["seen", "Seen check"],
  ["detailBg", "Detail background"], ["detailText", "Detail text"], ["detailText2", "Detail secondary text"],
  ["detailSelected", "Detail selected choice"], ["detailField", "Detail reply field"],
];

const ico = {
  lighthouse: '<svg width="26" height="30" viewBox="0 0 26 30" fill="currentColor"><path d="M13 1l4 5H9z"/><path d="M1 8l7-1v2zM25 8l-7-1v2z" opacity=".7"/><path d="M9 7h8l3 22H6z"/></svg>',
  gear: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
  tray: '<svg width="24" height="22" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12l3-9h14l3 9v7H2z"/><path d="M2 12h6l1 3h6l1-3h6"/></svg>',
  replied: '<svg width="24" height="22" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4L3 10l6 6"/><path d="M3 10h11a7 7 0 017 7v2"/></svg>',
  search: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>',
  back: '<svg width="14" height="22" viewBox="0 0 14 22" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M11 2L3 11l8 9"/></svg>',
  check: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M4 12.5l5 5L20 6"/></svg>',
  chat: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  bubble: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>',
};

function t(name) { return `class="targetable" data-c="${name}"`; }

function listPhone() {
  return `<div class="phone" ${t("Master list")}>
    <div class="status">7:31</div>
    <div class="top">
      <div class="brand">${ico.lighthouse}<span>Harklight</span></div>
      <div class="circle glass" ${t("Settings button")}>${ico.gear}</div>
    </div>
    <div class="row toptier" ${t("Top-tier row, error")}>
      <div class="meta"><span>Server</span><span>7:12 PM</span></div>
      <div class="t-top t-err">Release 0.1.10 failed to start</div>
      <div class="body l8">The new server release exited during startup on the push service. The previous release is still serving.</div>
    </div>
    <div class="row toptier" ${t("Top-tier row")}>
      <div class="meta"><span>App team</span><span>6:58 PM</span></div>
      <div class="t-top">Approve TestFlight build 18</div>
      <div class="body l8">Build 18 has the new back navigation, the floating chat button and optimistic answers. Approve it for the internal group?</div>
    </div>
    <div class="row sel" ${t("Mid-tier row, last viewed")}>
      <div class="meta"><span>Test agent<span class="dot"></span></span><span>2:07 PM</span></div>
      <div class="t-mid">Chat and choice buttons round trip</div>
      <div class="body l4">Pick one of the choices below, or send a chat message first if you want to try the back-and-forth again.</div>
    </div>
    <div class="row" ${t("Mid-tier row, warning")}>
      <div class="meta"><span>Gateway</span><span>Yesterday</span></div>
      <div class="t-mid t-warn">Gateway restart pending</div>
      <div class="body l4">A restart is queued for the next quiet window. Nothing is needed from you.</div>
    </div>
    <div class="row resolved" ${t("Low-tier row, resolved")}>
      <div class="meta"><span>Server</span><span>Tuesday</span></div>
      <div class="t-low">Homebrew formula merged</div>
      <div class="body l2">harklight-agent 0.1.1 installs with brew.</div>
    </div>
    <div class="bottom">
      <div class="tabs glass" ${t("Tab bar")}><div class="tab on">${ico.tray}</div><div class="tab">${ico.replied}</div></div>
      <div class="circle glass" style="width:52px;height:52px" ${t("Search button")}>${ico.search}</div>
    </div>
  </div>`;
}

function detailPhone() {
  return `<div class="phone detail" ${t("Message detail")}>
    <div class="status">7:27</div>
    <div class="dtop">
      <div class="circle glass" ${t("Back button")}>${ico.back}</div>
      <div class="pill glass" ${t("Position pill")}>3 of 6</div>
      <div class="circle accentbtn" ${t("Done button")}>${ico.check}</div>
    </div>
    <div class="dbody">
      <div class="sender"><div class="ini">TH</div><span style="flex:1">Test agent</span><span>2:07 PM</span><span style="color:var(--accent)">${ico.bubble}</span></div>
      <div class="dtitle">Chat and choice buttons round trip</div>
      <p class="dtext">Pick one of the choices below, or send a chat message first if you want to try the back-and-forth again.</p>
      <div class="choice on" ${t("Selected choice with reply box")}>
        <div style="display:flex;gap:10px;align-items:center"><div class="radio"></div><b>It worked</b></div>
        <div class="reply" ${t("Reply editor")}>Both legs came through on the phone.</div>
        <div class="send"><span class="accentbtn">Send</span></div>
      </div>
      <div class="choice" ${t("Unselected choice")}><div class="radio"></div>Something broke</div>
      <div class="choice" ${t("No comment choice")}><div class="radio"></div><span style="color:var(--text2)">No comment</span></div>
    </div>
    <div class="fab glass" ${t("Floating chat button")}>${ico.chat}</div>
  </div>`;
}

function notices() {
  return `<div class="notices" ${t("Notice bodies")}>
    <div class="notice n-info" ${t("Info notice")}><b>Info</b>Build 18 is processing.<div class="seen">${ico.check.replace('width="22" height="22"','width="14" height="14"')}Seen</div></div>
    <div class="notice n-warn" ${t("Warning notice")}><b>Warning</b>Restart queued for tonight.</div>
    <div class="notice n-err" ${t("Error notice")}><b>Error</b>Release failed to start.</div>
    <div class="notice n-done" ${t("Completed notice")}><b>Completed</b>Formula merged.</div>
  </div>`;
}

function vars(p) {
  return Object.entries(p).filter(([k]) => !k.startsWith("_") && typeof p[k] === "string").map(([k, v]) => `--${k}:${v}`).join(";");
}

function swatches(pal, mode) {
  const p = pal[mode];
  const flags = (pal._flags && pal._flags[mode]) || {};
  return `<div class="swatches">` + ROLES.map(([k, name]) =>
    `<div class="sw targetable" data-c="Swatch: ${name} (${mode})"><div class="chip" style="background:${p[k]}"></div>
     <div class="lab"><b>${name}</b><code>${p[k]}</code>${flags[k] ? `<div class="warnflag">${flags[k]}</div>` : ""}</div></div>`).join("") + `</div>`;
}

let current = (location.hash.slice(1) && PALETTES[location.hash.slice(1)]) ? location.hash.slice(1) : Object.keys(PALETTES)[0];

const TYPE_NAMES = { request: "Request", info: "Information", done: "Completed", warning: "Warning", error: "Error" };
const TYPE_ICONS = {
  request: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  done: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
  warning: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>',
  error: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>',
};
const TYPED_MESSAGES = [
  { type: "error", tier: "top", sender: "Push service", time: "7:42 PM", chat: "new", state: "committed", reply: "Roll back now. Renew the certificate tomorrow and retry then.", title: "Push service stopped delivering", body: "Notifications since 7:30 PM are queued, not delivered. The relay lost its Apple certificate after the restart. Roll back to the previous relay, or retry with the renewed certificate?", choices: ["Roll back", "Retry with new certificate"] },
  { type: "request", tier: "top", sender: "Web team", time: "7:15 PM", chat: "read", state: "composing", reply: "Email only for tomorrow. Name and team can come once the dashboard needs them.", title: "Which sign-in page goes live first?", body: "Both are ready. The short one asks for email only. The full one adds a name and team. Pick one for tomorrow's dev release.", choices: ["Email only", "Email, name and team"] },
  { type: "request", tier: "middle", sender: "App team", time: "6:50 PM", chat: "new", title: "Keep the swipe-past gesture on replies?", body: "Swiping past a reply now accepts it. Two testers did it by accident this week.", choices: ["Keep it", "Require a tap"] },
  { type: "warning", tier: "middle", sender: "Release", time: "4:05 PM", chat: "read", title: "Distribution certificate expires in 9 days", body: "TestFlight builds stop uploading on November 1 unless the certificate is renewed in your Apple developer account." },
  { type: "info", tier: "low", sender: "TestFlight", time: "3:20 PM", title: "Build 19 is processing", body: "It should reach your phone in about 15 minutes." },
  { type: "done", tier: "low", sender: "Server", time: "Yesterday", title: "Homebrew formula merged", body: "brew install harklight-agent now works.", resolved: true },
  { type: "info", tier: "low", sender: "Dashboard", time: "Tuesday", title: "Weekly summary", body: "41 messages, 12 answered within an hour, 3 still open." },
];

function typedListPhone(p, backIdx = 2, tall = false) {
  const rows = TYPED_MESSAGES.map((m, i) => {
    const tc = p.types[m.type];
    const tierClass = m.tier === "top" ? "toptier" : "";
    const tcls = m.tier === "top" ? "t-top" : m.tier === "middle" ? "t-mid" : "t-low";
    const lines = m.tier === "top" ? "l8" : m.tier === "middle" ? "l4" : "l2";
    return `<div class="row typed ${tierClass} ${i === backIdx ? "back" : ""} ${m.resolved ? "resolved" : ""}" style="--edge:${tc.edge};--backbar:${tc.bg};--rowtint:${tc.tint}" ${t(TYPE_NAMES[m.type] + " row, " + m.tier + " tier" + (i === backIdx ? ", the one you came back from" : ""))}>
      <div class="meta"><span class="tsender"><span style="color:${tc.icon || tc.bg}">${TYPE_ICONS[m.type]}</span>${m.sender}</span><span class="tright">${m.chat ? `<span class="chatflag ${m.chat}" ${t(m.chat === "new" ? "Chat flag, new message" : "Chat flag, chat started")}>${m.chat === "new" ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18v13H9l-6 5z"/></svg>' : ico.bubble.replace('width="22" height="22"', 'width="15" height="15"')}</span>` : ""}${m.time}</span></div>
      <div class="${tcls}">${m.title}</div>
      <div class="body ${lines}">${m.body}</div>
    </div>`;
  }).join("");
  return `<div class="phone ${tall ? "tall" : ""}" ${t(tall ? "Full master list" : "Master list")}>
    <div class="status">7:44</div>
    <div class="top">
      <div class="brand">${ico.lighthouse}<span>Harklight</span></div>
      <div class="circle glass" ${t("Settings button")}>${ico.gear}</div>
    </div>
    ${rows}
    <div class="bottom">
      <div class="tabs glass" ${t("Tab bar")}><div class="tab on">${ico.tray}</div><div class="tab">${ico.replied}</div></div>
      <div class="circle glass" style="width:52px;height:52px" ${t("Search button")}>${ico.search}</div>
    </div>
  </div>`;
}

function typedDetailPhone(p, m, idx) {
  const tc = p.types[m.type];
  const answer = m.choices
    ? m.choices.map((c, i) => {
        const on = i === 0 && m.state;
        const committed = on && m.state === "committed"
          ? `<div class="committed" ${t("Committed reply text (tap to edit)")}>${m.reply}</div>` : "";
        return `<div class="choice ${on ? "on" : ""}" ${t(on ? "Selected choice" : "Unselected choice")}><div class="radio"></div><div class="ctext">${on ? `<b>${c}</b>` : c}${committed}</div></div>`;
      }).join("") +
      `<div class="choice" ${t("No comment choice")}><div class="radio"></div><span style="color:var(--text2)">No comment</span></div>`
    : `<div class="seenbtn glass" ${t("Seen button")}>${ico.check.replace('width="22" height="22"', 'width="16" height="16"')} Seen</div>`;
  const keyboard = m.state === "composing" ? `
    <div class="kbwrap">
      <div class="replybar" ${t("Reply input over keyboard")}>
        <div class="replyfield">${m.reply}</div>
        <div class="sendup" ${t("Send button")}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M12 20V5M5 11l7-7 7 7"/></svg></div>
      </div>
      <div class="kb" ${t("Keyboard")}>${["qwertyuiop", "asdfghjkl", "zxcvbnm"].map(r => `<div class="kbrow">${[...r].map(k => `<span>${k}</span>`).join("")}</div>`).join("")}<div class="kbrow"><span class="wide">123</span><span class="space">space</span><span class="wide">return</span></div></div>
    </div>` : "";
  const fab = m.state === "composing" ? "" : m.chat === "new"
    ? `<div class="fab fabnew" ${t("Chat button, new message waiting")}>${ico.chat}<i></i></div>`
    : `<div class="fab glass" ${t(m.chat ? "Chat button, chat started" : "Chat button, no chat yet")}>${ico.chat}</div>`;
  return `<div class="phone detail" style="--detailBg:${tc.bg};--detailText:${tc.text};--detailText2:${tc.text2}" ${t(TYPE_NAMES[m.type] + " detail")}>
    <div class="status">7:44</div>
    <div class="dtop">
      <div class="circle glass" ${t("Back button")}>${ico.back}</div>
      <div class="pill glass">${idx + 1} of 7</div>
      <div class="circle accentbtn" ${t("Done button")}>${ico.check}</div>
    </div>
    <div class="dbody">
      <div class="sender"><div class="ini">${m.sender.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase()}</div><span style="flex:1">${m.sender}</span><span>${m.time}</span></div>
      <div class="typelabel">${TYPE_ICONS[m.type]} ${TYPE_NAMES[m.type]}</div>
      <div class="dtitle">${m.title}</div>
      <p class="dtext">${m.body}</p>
      ${answer}
    </div>
    ${fab}${keyboard}
  </div>`;
}

function typedSwatches(p, mode) {
  return `<div class="swatches">` + Object.entries(p.types).map(([k, c]) =>
    `<div class="sw targetable" data-c="Swatch: ${TYPE_NAMES[k]} (${mode})"><div class="chip" style="background:${c.bg};color:${c.text};display:grid;place-items:center;font-weight:600">${TYPE_NAMES[k]}</div>
     <div class="lab"><b>${TYPE_NAMES[k]}</b><code>bg ${c.bg} · text ${c.text} · edge ${c.edge}</code></div></div>`).join("") + `</div>`;
}

function renderTyped(pal) {
  const firstOfType = ["request", "info", "done", "warning", "error"].map(ty => TYPED_MESSAGES.findIndex(m => m.type === ty));
  return ["light", "dark"].map(mode => `
    <section class="mode" style="${vars(pal[mode])}" data-mode="${mode}">
      <h2>${pal._name}, ${mode} mode</h2>
      <div class="phones">${typedListPhone(pal[mode], 2, true)}${firstOfType.map(i => typedDetailPhone(pal[mode], TYPED_MESSAGES[i], i)).join("")}</div>
      <div class="wide" ${t("Wide screen, list and detail side by side")}>${typedListPhone(pal[mode], 1)}${typedDetailPhone(pal[mode], { ...TYPED_MESSAGES[1], state: null }, 1)}</div>
      ${typedSwatches(pal[mode], mode)}
      ${swatches(pal, mode)}
    </section>`).join("");
}

function render() {
  const pick = document.getElementById("palPick");
  pick.innerHTML = Object.entries(PALETTES).map(([id, p]) => `<button class="${id === current ? "on" : ""}" data-id="${id}">${p._name}</button>`).join("");
  pick.querySelectorAll("button").forEach(b => b.onclick = () => { current = b.dataset.id; location.hash = current; render(); });
  const pal = PALETTES[current];
  document.getElementById("palNote").textContent = pal._note;
  document.getElementById("modes").classList.toggle("stacked", !!pal._typed);
  document.getElementById("modes").innerHTML = pal._typed ? renderTyped(pal) : ["light", "dark"].map(mode => `
    <section class="mode" style="${vars(pal[mode])}" data-mode="${mode}">
      <h2>${pal._name}, ${mode} mode</h2>
      <div class="phones">${listPhone()}${detailPhone()}</div>
      ${notices()}
      ${swatches(pal, mode)}
    </section>`).join("");
}

render();

</script>
</body>
</html>
